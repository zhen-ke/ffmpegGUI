name: Build On Version Bump

on:
  push:
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-on-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: 检测版本号是否变动
  # ─────────────────────────────────────────────────────────────
  detect-version-bump:
    name: Detect Version Bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version_check.outputs.changed }}
      version: ${{ steps.version_check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check package.json version diff
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(node -p "require('./package.json').version")"
          previous_version=""
          changed="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed="true"
          else
            before_sha="${{ github.event.before }}"
            if [ -n "$before_sha" ] && [ "$before_sha" != "0000000000000000000000000000000000000000" ]; then
              if ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$before_sha"
              fi

              if git cat-file -e "${before_sha}:package.json" 2>/dev/null; then
                previous_version="$(git show "${before_sha}:package.json" | node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync(0,'utf8')); process.stdout.write(pkg.version || '')")"
              fi
            fi

            if [ -n "$previous_version" ] && [ "$current_version" != "$previous_version" ]; then
              changed="true"
            fi
          fi

          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "current_version=$current_version"
          echo "previous_version=$previous_version"
          echo "changed=$changed"

  # ─────────────────────────────────────────────────────────────
  # Job 2: 构建 Webpack 产物（只跑一次，结果共享给 4 个平台 job）
  # webpack 编译产物（JS/CSS）与平台无关，没必要在每台 runner 上各跑一遍。
  # ─────────────────────────────────────────────────────────────
  build-webpack:
    name: Build Webpack Assets
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync release/app version
        run: npm run sync:version

      # --ignore-scripts 跳过 postinstall 中的 build:dll（CI 生产构建不需要开发环境 DLL）
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build webpack (main + renderer)
        run: npm run build

      # 将平台无关的 dist 产物上传，供各平台 job 复用
      - name: Upload webpack dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webpack-dist
          path: release/app/dist
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # Job 3: 各平台打包（下载 webpack 产物，只跑 electron-builder）
  # ─────────────────────────────────────────────────────────────
  build-and-package:
    name: Package (${{ matrix.target_id }})
    needs: [detect-version-bump, build-webpack]
    if: needs.detect-version-bump.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_id: win-x64
            platform_flag: --win
            arch_flag: --x64
            bundle_dir: release/build/win-unpacked
          - os: ubuntu-latest
            target_id: linux-x64
            platform_flag: --linux
            arch_flag: --x64
            bundle_dir: release/build/linux-unpacked
          - os: macos-latest
            target_id: mac-x64
            platform_flag: --mac
            arch_flag: --x64
            bundle_dir: release/build/mac
          - os: macos-latest
            target_id: mac-arm64
            platform_flag: --mac
            arch_flag: --arm64
            bundle_dir: release/build/mac-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync release/app version
        run: npm run sync:version

      # --ignore-scripts 跳过 build:dll（CI 生产构建不需要开发环境 DLL）
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      # 为当前平台下载 Electron 原生模块（node-pty 预编译二进制）
      - name: Install Electron native deps
        run: npx electron-builder install-app-deps

      # symlink 不走 cache，每次重建（link-modules.ts 本身执行极快）
      - name: Link src/node_modules → release/app/node_modules
        run: node -r ts-node/register ./.erb/scripts/link-modules.ts

      # 下载 build-webpack job 生成的平台无关产物，放到 electron-builder 期望的位置
      - name: Download webpack dist
        uses: actions/download-artifact@v4
        with:
          name: webpack-dist
          path: release/app/dist

      # 只跑 electron-builder 打包，不再执行 webpack
      - name: Package app with electron-builder
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform_flag }}" = "--mac" ]; then
            npx electron-builder --publish never ${{ matrix.platform_flag }} dir ${{ matrix.arch_flag }} --config.mac.identity=null
          else
            npx electron-builder --publish never ${{ matrix.platform_flag }} dir ${{ matrix.arch_flag }}
          fi

      - name: Validate unpacked directory
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${{ matrix.bundle_dir }}" ]; then
            echo "Expected unpacked folder not found: ${{ matrix.bundle_dir }}"
            ls -la release/build || true
            exit 1
          fi

      - name: Archive package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.detect-version-bump.outputs.version }}"
          $targetId = "${{ matrix.target_id }}"
          $bundleDir = "${{ matrix.bundle_dir }}"
          $zipPath = "release/artifacts/FFmpegGUI-v$version-$targetId.zip"

          New-Item -ItemType Directory -Path "release/artifacts" -Force | Out-Null
          Compress-Archive -Path "$bundleDir/*" -DestinationPath $zipPath -Force

      - name: Archive package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.detect-version-bump.outputs.version }}"
          target_id="${{ matrix.target_id }}"
          bundle_dir="${{ matrix.bundle_dir }}"
          zip_path="release/artifacts/FFmpegGUI-v${version}-${target_id}.zip"

          mkdir -p release/artifacts
          ditto -c -k --keepParent "$bundle_dir" "$zip_path"

      - name: Archive package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.detect-version-bump.outputs.version }}"
          target_id="${{ matrix.target_id }}"
          bundle_dir="${{ matrix.bundle_dir }}"
          zip_path="release/artifacts/FFmpegGUI-v${version}-${target_id}.zip"

          mkdir -p release/artifacts
          parent_dir="$(dirname "$bundle_dir")"
          base_name="$(basename "$bundle_dir")"
          (
            cd "$parent_dir"
            zip -qry "$GITHUB_WORKSPACE/$zip_path" "$base_name"
          )

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFmpegGUI-v${{ needs.detect-version-bump.outputs.version }}-${{ matrix.target_id }}
          path: release/artifacts/FFmpegGUI-v${{ needs.detect-version-bump.outputs.version }}-${{ matrix.target_id }}.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Job 4: 发布 GitHub Release（与原来相同）
  # ─────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [detect-version-bump, build-and-package]
    if: needs.detect-version-bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all zip artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FFmpegGUI-v${{ needs.detect-version-bump.outputs.version }}-*
          merge-multiple: true
          path: release/release-assets

      - name: Create or update release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${{ needs.detect-version-bump.outputs.version }}"
          tag="v${version}"
          title="v${version}"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists. Regenerating notes..."
            notes="$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$tag" \
              -f target_commitish="${{ github.sha }}" \
              --jq '.body')"
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" \
              --title "$title" \
              --target "${{ github.sha }}" \
              --generate-notes
          fi

          shopt -s nullglob
          files=(release/release-assets/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No zip assets found for release upload."
            ls -la release/release-assets || true
            exit 1
          fi

          gh release upload "$tag" "${files[@]}" --clobber
