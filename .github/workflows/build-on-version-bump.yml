name: Build On Version Bump

on:
  push:
    paths:
      - package.json
  workflow_dispatch:

jobs:
  detect-version-bump:
    name: Detect Version Bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version_check.outputs.changed }}
      version: ${{ steps.version_check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check package.json version diff
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(node -p "require('./package.json').version")"
          previous_version=""
          before_sha="${{ github.event.before }}"

          if [ -n "$before_sha" ] && [ "$before_sha" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "${before_sha}:package.json" 2>/dev/null; then
              previous_version="$(git show "${before_sha}:package.json" | node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync(0,'utf8')); process.stdout.write(pkg.version || '')")"
            fi
          fi

          changed="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed="true"
          fi

          if [ -n "$previous_version" ] && [ "$current_version" != "$previous_version" ]; then
            changed="true"
          fi

          if [ -z "$previous_version" ]; then
            echo "No previous package.json found in parent commit. Skip build."
          fi

          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "current_version=$current_version"
          echo "previous_version=$previous_version"
          echo "changed=$changed"

  build:
    name: Build (${{ matrix.target_id }})
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            arch_flag: --x64
            target_id: win-x64
            output_dir_glob: win-*
          - os: ubuntu-latest
            platform: linux
            arch: x64
            arch_flag: --x64
            target_id: linux-x64
            output_dir_glob: linux-*
          - os: macos-latest
            platform: mac
            arch: x64
            arch_flag: --x64
            target_id: mac-x64
            output_dir_glob: mac
          - os: macos-latest
            platform: mac
            arch: arm64
            arch_flag: --arm64
            target_id: mac-arm64
            output_dir_glob: mac-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project assets
        run: npm run build

      - name: Build app for current platform/arch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npx electron-builder --publish never --${{ matrix.platform }} dir ${{ matrix.arch_flag }} --config.mac.identity=null
          else
            npx electron-builder --publish never --${{ matrix.platform }} dir ${{ matrix.arch_flag }}
          fi

      - name: Locate packaged directory
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          candidates=(release/build/${{ matrix.output_dir_glob }})
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "No packaged output found under release/build"
            ls -la release/build || true
            exit 1
          fi

          bundle_dir="${candidates[0]}"
          echo "bundle_dir=$bundle_dir" >> "$GITHUB_OUTPUT"
          echo "bundle_dir=$bundle_dir"

      - name: Archive package (Windows)
        if: runner.os == 'Windows'
        id: archive_win
        shell: pwsh
        run: |
          $version = "${{ needs.detect-version-bump.outputs.version }}"
          $targetId = "${{ matrix.target_id }}"
          $bundleDir = "${{ steps.locate.outputs.bundle_dir }}"
          $zipPath = "release/artifacts/FFmpegGUI-v$version-$targetId.zip"

          New-Item -ItemType Directory -Path "release/artifacts" -Force | Out-Null
          Compress-Archive -Path "$bundleDir/*" -DestinationPath $zipPath -Force

          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Archive package (macOS / Linux)
        if: runner.os != 'Windows'
        id: archive_unix
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.detect-version-bump.outputs.version }}"
          target_id="${{ matrix.target_id }}"
          bundle_dir="${{ steps.locate.outputs.bundle_dir }}"
          zip_path="release/artifacts/FFmpegGUI-v${version}-${target_id}.zip"

          mkdir -p release/artifacts
          parent_dir="$(dirname "$bundle_dir")"
          base_name="$(basename "$bundle_dir")"
          (
            cd "$parent_dir"
            zip -rq "$GITHUB_WORKSPACE/$zip_path" "$base_name"
          )

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFmpegGUI-v${{ needs.detect-version-bump.outputs.version }}-${{ matrix.target_id }}
          path: release/artifacts/*.zip
          if-no-files-found: error
